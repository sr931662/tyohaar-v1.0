name: tyohaar
description: "Tyohaar — the home for life's celebrations. Customer mobile app UI."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  dio: ^5.7.0
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shimmer: ^3.0.0
  razorpay_flutter: ^1.3.7
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  gal: ^2.3.1
  permission_handler: ^11.3.1
  firebase_core: ^3.8.0
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.3.5
  firebase_performance: ^0.10.0+8
  flutter_local_notifications: ^18.0.1
  device_info_plus: ^11.2.0
  flutter_contacts: ^1.1.9+2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0
  html: ^0.15.6
  file_picker: ^8.1.6
  # Runtime-used (FlutterNativeSplash.preserve/remove in main.dart/app.dart),
  # not just the `dart run flutter_native_splash:create` codegen tool.
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.3
  flutter_secure_storage_platform_interface: ^1.1.2
  firebase_core_platform_interface: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png
    - assets/images/tyohaar-mark.png
    - assets/images/Landing page image.png
    - assets/images/onboarding 1.png
    - assets/images/onboarding 2.png
    - assets/images/onboarding 3.png
    - assets/images/onboarding 4.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#F6F1E8"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F6F1E8"
  image: assets/logo.png
  android_12:
    color: "#F6F1E8"
    # Android 12+ applies its own additional masking/inset on top of the
    # supplied icon, so the plain logo (fine as a launcher icon) renders
    # visibly cropped here. This variant has generous transparent padding
    # (content ~20% of the canvas) specifically to survive that masking.
    image: assets/images/splash_icon_android12.png
  android: true
  ios: false
